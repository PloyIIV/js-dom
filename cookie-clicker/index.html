<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Jersey+15&family=Micro+5&family=Pixelify+Sans:wght@400..700&family=Tiny5&display=swap" rel="stylesheet">
</head>
<body>
    <section class="sec-1">
        <header>
            <h1>MapleStory Clicker</h1>
        </header>
        <div>
            <img class="character" src="./assets/char1.gif" alt="character">
            <footer>
                <p>Character name: <span class="username">PloyIIV</span></p>
                <p>Click: <span class="click-count"></span></p>
                <p>Per Second: <span class="second-count"></span></p>
            </footer>
        </div>
        <img class="maple-background" src="./assets/background.gif" alt="MapleStory background">
    </section>
    <section class="sec-2">
        <div></div>
    </section>
    <section class="sec-3">
        <div>
            <h3>DEPLOY UNITS</h3>
            <hr style="border: 2.5px solid white; margin-bottom: 20px;">
        </div>
        <div class="skill-container">
            <div class="skill-div">
                <img src="https://www.pngitem.com/pimgs/m/12-127350_maplestory-slime-hd-png-download.png" alt="slime">
                <div class="skill-detail">
                    <h4>SLIME</h4>
                    <hr>
                    <p>+1 Click Power</p>
                </div>
            </div>
            <div class="skill-div">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKNDBZfgckKR4zwY-cMVXEWcxUQ3g5vdQP8WEj8_N3Nw&s=10" alt="snail">
                <div class="skill-detail">
                    <h4>FIREFLY</h4>
                    <hr>
                    <p>+1 Click Power</p>
                </div>
            </div>
            <div class="skill-div">
                <img src="https://i.pinimg.com/736x/ac/31/f3/ac31f3929a56737c91030dbd553efa80.jpg" alt="mushroom">
                <div class="skill-detail">
                    <h4>FIREFLY</h4>
                    <hr>
                    <p>+1 Click Power</p>
                </div>
            </div>
            <div class="skill-div">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ36hm_Qp0FoUdEqMPIkXdvzh4JRXFSZUIegAGHfXiA&s=10" alt="trunk">
                <div class="skill-detail">
                    <h4>FIREFLY</h4>
                    <hr>
                    <p>+1 Click Power</p>
                </div>
            </div>
            <div class="skill-div">
                <img src="https://static.vecteezy.com/system/resources/previews/070/959/373/non_2x/pixel-art-firefly-with-glowing-abdomen-on-transparent-background-illustration-png.png" alt="firefly">
                <div class="skill-detail">
                    <h4>FIREFLY</h4>
                    <hr>
                    <p>+1 Click Power</p>
                </div>
            </div>
            
        </div>
        <img class="sec-3-background" src="https://i.redd.it/2lilft2z0nk51.jpg" alt="background">
    </section>
    <script src="script.js"></script>
</body>
</html>
